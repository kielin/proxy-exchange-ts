<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代理IP调换工具 TS‑Express【升级版-订单勾选】</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;max-width:1500px;margin:28px auto;padding:0 18px;background:#f4f7fa}
.card{background:#ffffff;padding:22px;border-radius:10px;margin-bottom:18px;box-shadow:0 1px 4px #00000015}
textarea,input{width:100%;padding:10px 12px;border:1px solid #d2d6dc;border-radius:6px;font-size:14px}
textarea{min-height:110px;font-family:Menlo,Monaco,monospace}
button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;margin-right:8px;margin-bottom:8px}
button:disabled{background:#94a3b8}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #cbd5e1;padding:9px 11px;text-align:left;font-size:13px}
th{background:#eff4ff}
pre{margin:0;font-family:Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.warn{color:#b91c1c;font-size:13px}
.tip{color:#475569;font-size:13px}
</style>
</head>
<body>
<h2>代理IP调换工具｜订单勾选+自定义Note过滤</h2>
<div class="card">
    <p class="warn">⚠️Cookie从浏览器F12‑Network复制；Cookie存在过期，失效需要重新复制。</p>
    <div style="margin-bottom:12px;">
        <label>完整Cookie字符串</label>
        <textarea id="cookieInput" placeholder="temmoku_xxx=xxx; ..."></textarea>
    </div>

    <div style="margin-bottom:12px;">
        <button id="loadOrderBtn">1.加载全部订单列表(index接口)</button>
    </div>
    <div id="orderBox"></div>

    <div style="margin:14px 0;">
        <label>代理note过滤关键词(逗号分隔，留空默认过滤 ej,交易，例：EJ,Ekin)</label>
        <input id="filterKwInput" placeholder="留空使用默认 ej,交易"/>
    </div>

    <div style="margin-bottom:12px;">
        <button id="loadListBtn" disabled>2.加载选中iid下代理列表</button>
    </div>
    <div id="listBox"></div>

    <div style="margin-top:14px;">
        <label>已勾选代理ID（自动填充，逗号分隔）</label>
        <input id="idsInput" readonly placeholder="勾选上方代理表格自动填充"/>
    </div>

    <div style="margin-top:14px">
        <button id="runBtn" disabled>3.执行调换，生成新旧对照表 + 写入日志</button>
    </div>
</div>

<div class="card">
    <h4>调换结果（项目｜地区｜代理ID｜调换前socks｜调换后socks）</h4>
    <div id="resultBox"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const loadOrderBtn = $("#loadOrderBtn");
const loadListBtn = $("#loadListBtn");
const runBtn = $("#runBtn");

let selectedIid = null;

// 步骤1：加载订单列表
loadOrderBtn.onclick = async ()=>{
    const cookie = $("#cookieInput").value.trim();
    const orderBox = $("#orderBox");
    if(!cookie){
        alert("请填写 Cookie");
        return;
    }
    orderBox.innerText = "订单加载中...";
    const resp = await fetch("/api/get_orders",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({cookie})
    });
    const json = await resp.json();
    if(json.code !==0){
        orderBox.innerText = JSON.stringify(json,null,2);
        return;
    }
    const orders = json.data;
    selectedIid = null;
    loadListBtn.disabled = true;
    runBtn.disabled = true;

    let html = `<table>
        <tr>
            <th>选择</th>
            <th>iid</th>
            <th>订单编号</th>
            <th>项目名称</th>
            <th>note</th>
            <th>数量</th>
        </tr>`;
    orders.forEach(item=>{
        html += `<tr>
            <td><input type="radio" name="orderRadio" data-iid="${item.id}"></td>
            <td>${item.id}</td>
            <td>${item.orderno}</td>
            <td>${item.proname||"-"}</td>
            <td>${item.note||"-"}</td>
            <td>${item.num}</td>
        </tr>`;
    })
    html += `</table>`;
    orderBox.innerHTML = html;

    // 单选选择iid
    $$('input[name="orderRadio"]').forEach(rd=>{
        rd.onchange = function(){
            selectedIid = this.dataset.iid;
            loadListBtn.disabled = false;
        }
    })
}

// 步骤2：加载代理列表
loadListBtn.onclick = async ()=>{
    const cookie = $("#cookieInput").value.trim();
    const filterRaw = $("#filterKwInput").value.trim();
    const listBox = $("#listBox");
    if(!cookie || !selectedIid){
        alert("请先勾选一个订单iid");
        return;
    }
    // 解析过滤关键词
    let filterArr = [];
    if(filterRaw){
        filterArr = filterRaw.split(',').map(x=>x.trim()).filter(Boolean);
    }
    listBox.innerText = "代理列表加载中...";
    const resp = await fetch("/api/get_list",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({cookie,iid:selectedIid,filterKeywords:filterArr})
    });
    const json = await resp.json();
    if(json.code !==0){
        listBox.innerText = JSON.stringify(json,null,2);
        return;
    }
    const proxyList = json.data;
    runBtn.disabled = false;

    let html = `<table>
        <tr>
            <th><input type="checkbox" id="checkAll"></th>
            <th>ID</th>
            <th>所属项目</th>
            <th>地区</th>
            <th>IP</th>
            <th>端口</th>
            <th>用户名</th>
            <th>note</th>
        </tr>`;
    proxyList.forEach(item=>{
        const projTitle = item.project?.title || "-";
        html += `<tr>
            <td><input type="checkbox" class="itemCheck" data-id="${item.id}"></td>
            <td>${item.id}</td>
            <td>${projTitle}</td>
            <td>${item.cityname || "-"}</td>
            <td>${item.ip}</td>
            <td>${item.port}</td>
            <td>${item.p_user}</td>
            <td>${item.note || "-"}</td>
        </tr>`;
    })
    html += `</table>`;
    listBox.innerHTML = html;

    // 全选
    $("#checkAll").onchange = function(){
        $$(".itemCheck").forEach(cb=>cb.checked = this.checked);
        syncIds();
    }
    $$(".itemCheck").forEach(cb=>{
        cb.onchange = syncIds;
    })
}

// 同步勾选id到输入框
function syncIds(){
    const checked = Array.from($$(".itemCheck")).filter(cb=>cb.checked).map(cb=>cb.dataset.id);
    $("#idsInput").value = checked.join(",");
}

// 步骤3：执行调换
runBtn.onclick = async ()=>{
    const cookie = $("#cookieInput").value.trim();
    const idsRaw = $("#idsInput").value.trim();
    const resultBox = $("#resultBox");

    if(!cookie || !selectedIid || !idsRaw){
        alert("参数不全，请确认已勾选订单、勾选代理");
        return;
    }
    const idsArr = idsRaw.split(',').map(x=>x.trim()).filter(Boolean);
    runBtn.disabled = true;
    resultBox.innerText = "请求处理中...";

    try{
        const resp = await fetch("/api/exchange_ip",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({cookie,iid:selectedIid,ids:idsArr,isrand:3})
        });
        const json = await resp.json();
        runBtn.disabled = false;

        if(json.code !== 0){
            resultBox.innerText = JSON.stringify(json,null,2);
            return;
        }
        const tableData = json.table;
        let html = `<table>
        <tr>
            <th>项目</th>
            <th>地区</th>
            <th>代理ID</th>
            <th>调换前 socks5</th>
            <th>调换后 socks5</th>
        </tr>`;
        tableData.forEach(row=>{
            html += `<tr>
                <td>${row.project}</td>
                <td>${row.beforeCity}</td>
                <td>${row.proxyId}</td>
                <td><pre>${row.beforeSocks}</pre></td>
                <td><pre>${row.afterSocks}</pre></td>
            </tr>`;
        });
        html += `</table>`;
        resultBox.innerHTML = html;
    }catch(e){
        runBtn.disabled = false;
        resultBox.innerText = "网络异常:" + e.message;
    }
}
</script>
</body>
</html>
