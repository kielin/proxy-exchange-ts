<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代理IP调换工具（模块化版）</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;max-width:1600px;margin:28px auto;padding:0 18px;background:#f4f7fa}
.card{background:#fff;padding:22px;border-radius:10px;margin-bottom:18px;box-shadow:0 1px 4px #00000015}
textarea,input{width:100%;padding:10px 12px;border:1px solid #d2d6dc;border-radius:6px;font-size:14px}
textarea{min-height:110px;font-family:Menlo,Monaco,monospace}
button{padding:8px 14px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-right:6px;margin-bottom:6px}
button:disabled{background:#94a3b8}
.btn-copy{background:#059669}
.btn-ads{background:#7c3aed}
.btn-create{background:#d6b912}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #cbd5e1;padding:9px 11px;text-align:left;font-size:13px}
th{background:#eff4ff}
pre{margin:0;font-family:Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.warn{color:#b91c1c;font-size:13px}
.ok{color:#16a34a;font-weight:bold}
.fail{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<h2>代理IP调换工具（模块化版）</h2>

<div class="card">
    <p class="warn">⚠️ Cookie从浏览器F12复制；AdsPower ApiKey在config.json配置</p>
    <div style="margin-bottom:12px;">
        <label>完整Cookie字符串</label>
        <textarea id="cookieInput" placeholder="temmoku_xxx=xxx; ..."></textarea>
    </div>

    <div style="margin-bottom:12px;">
        <button id="loadOrderBtn">1.加载订单列表</button>
    </div>
    <div id="orderBox"></div>

    <div style="margin:14px 0;">
        <label>note过滤关键词（留空默认 ej,交易）</label>
        <input id="filterKwInput" placeholder="EJ,Ekin"/>
    </div>

    <div style="margin-bottom:12px;">
        <button id="loadListBtn">2.刷新代理列表</button>
    </div>
    <div id="listBox"></div>

    <div style="margin-top:14px;">
        <label>已勾选代理ID</label>
        <input id="idsInput" readonly/>
    </div>

    <div style="margin-top:14px">
        <button id="runBtn" disabled>3.执行调换</button>
    </div>
</div>

<div class="card">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <h4 style="margin:0">调换结果</h4>
        <button id="copyAllBtn" class="btn-copy" disabled>📋一键复制全部socks</button>
        <button id="pushAdsBtn" class="btn-ads" disabled>🚀添加到AdsPower（EJ注册）</button>
        <button id="createEnvBtn" class="btn-create" disabled>创建环境</button>
    </div>
    <div id="resultBox"></div>
    <div id="adsResultBox" style="margin-top:16px"></div>
    <div id="envResultBox" style="margin-top:16px;"></div>
</div>

<div class="card">
    <h4>🔧 手动测试socks（一行一条）</h4>
    <textarea id="testSocksTextarea" placeholder="socks5://user:pass@ip:port"></textarea>
    <div style="margin-top:8px">
        <button id="testAddBtn">添加并测试</button>
    </div>
    <div id="testResultBox" style="margin-top:12px"></div>
</div>
<!-- <div class="card">
    <div style="margin-top:14px;">
        <div style="margin-top:8px">
            <button id="createEnvBtn">创建环境</button>
        </div>
    </div>
</div>
<div id="envResultBox" style="margin-top:16px;"></div> -->

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const loadOrderBtn = $("#loadOrderBtn");
const loadListBtn = $("#loadListBtn");
const runBtn = $("#runBtn");
const copyAllBtn = $("#copyAllBtn");
const pushAdsBtn = $("#pushAdsBtn");
const testAddBtn = $("#testAddBtn");
const createEnvBtn = $("#createEnvBtn");

let selectedIid = null|42206;
let globalAfterSocksList = [];
let globalProxyIds = [];

// ===== 加载代理列表 =====
async function loadProxyList(){
    const cookie = $("#cookieInput").value.trim();
    const filterRaw = $("#filterKwInput").value.trim();
    const listBox = $("#listBox");
    if(!cookie || !selectedIid) return;

    let filterArr = filterRaw ? filterRaw.split(',').map(x=>x.trim()).filter(Boolean) : [];
    listBox.innerText = "加载中...";

    const resp = await fetch("/api/get_list",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({cookie,iid:selectedIid,filterKeywords:filterArr})
    });
    const json = await resp.json();
    if(json.code !==0){ listBox.innerText = JSON.stringify(json,null,2); return; }

    const proxyList = json.data;
    runBtn.disabled = false;

    let html = `<table>
        <tr><th><input type="checkbox" id="checkAll"></th><th>ID</th><th>项目</th><th>地区</th><th>IP</th><th>端口</th><th>用户名</th><th>note</th></tr>`;
    proxyList.forEach(item=>{
        html += `<tr>
            <td><input type="checkbox" class="itemCheck" data-id="${item.id}"></td>
            <td>${item.id}</td><td>${item.project?.title||"-"}</td>
            <td>${item.cityname||"-"}</td><td>${item.ip}</td><td>${item.port}</td>
            <td>${item.p_user}</td><td>${item.note||"-"}</td>
        </tr>`;
    });
    listBox.innerHTML = html + `</table>`;

    $("#checkAll").onchange = function(){
        $$(".itemCheck").forEach(cb=>cb.checked=this.checked);
        syncIds();
    };
    $$(".itemCheck").forEach(cb=>cb.onchange=syncIds);
}

// ===== 加载订单 =====
loadOrderBtn.onclick = async ()=>{
    const cookie = $("#cookieInput").value.trim();
    const orderBox = $("#orderBox");
    if(!cookie){ alert("请填Cookie"); return; }

    orderBox.innerText = "加载中...";
    const resp = await fetch("/api/get_orders",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({cookie})
    });
    const json = await resp.json();
    if(json.code !==0){ orderBox.innerText = JSON.stringify(json,null,2); return; }

    const orders = json.data;
    selectedIid = null;
    // loadListBtn.disabled = true;
    runBtn.disabled = true;
    copyAllBtn.disabled = true;
    pushAdsBtn.disabled = true;
    globalAfterSocksList = [];
    $("#listBox").innerHTML = "";
    $("#idsInput").value = "";
    $("#resultBox").innerHTML = "";
    $("#adsResultBox").innerHTML = "";

    let html = `<table>
        <tr><th>选择</th><th>iid</th><th>订单号</th><th>项目</th><th>note</th><th>数量</th></tr>`;
    orders.forEach(item=>{
        html += `<tr>
            <td><input type="radio" name="orderRadio" data-iid="${item.id}"></td>
            <td>${item.id}</td><td>${item.orderno}</td>
            <td>${item.proname||"-"}</td><td>${item.note||"-"}</td><td>${item.num}</td>
        </tr>`;
    });
    orderBox.innerHTML = html + `</table>`;

    $$('input[name="orderRadio"]').forEach(rd=>{
        rd.onchange = async function(){
            selectedIid = this.dataset.iid;
            // loadListBtn.disabled = false;
            await loadProxyList();
        };
    });
};

loadListBtn.onclick = loadProxyList;

function syncIds(){
    const checked = Array.from($$(".itemCheck")).filter(cb=>cb.checked).map(cb=>cb.dataset.id);
    $("#idsInput").value = checked.join(",");
}

// ===== 一键复制 =====
copyAllBtn.onclick = async ()=>{
    if(!globalAfterSocksList.length) return;
    try{
        await navigator.clipboard.writeText(globalAfterSocksList.join("\n"));
        alert(`✅已复制 ${globalAfterSocksList.length} 条`);
    }catch(e){ alert("复制失败"); }
};

// ===== 推送到AdsPower =====
async function pushToAdsPower(socksList, resultBox){
    resultBox.innerText = "添加中...";
    try {
        console.log('Index.html 执行 pushToAdsPower')
        const resp = await fetch("/api/add_to_adspower", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ socksList }),
        });
        const json = await resp.json();
        console.log(`[pushToAdsPower] response: ${JSON.stringify(json)}`)

        if (json.code !== 0) {
            debugger;
            resultBox.innerText = `添加失败: ${json.msg || "未知错误"}`;
            return;
        }

        const { results, proxyIds: newProxyIds } = json.data;
        console.log("Updated proxyIds:", newProxyIds);
        globalProxyIds = [...globalProxyIds, ...newProxyIds]; // Update global proxyIds
        console.log("更新合并后的总 proxyIds:", globalProxyIds);
        createEnvBtn.disabled = false;

        // let html = `<table>
        //     <tr><th>Socks</th><th>添加</th><th>连通</th><th>备注</th></tr>`;
        // results.forEach(r => {
        //     html += `<tr>
        //         <td><pre>${r.socks}</pre></td>
        //         <td class="${r.addOk ? 'ok' : 'fail'}">${r.addOk ? '✅成功' : '❌失败'}</td>
        //         <td class="${r.testOk ? 'ok' : 'fail'}">${r.testOk ? '✅可用' : '❌不可用'}</td>
        //         <td>${r.msg}</td>
        //     </tr>`;
        // });
        // resultBox.innerHTML = html + `</table>`;
        let html = `<table>
        <tr><th>Socks</th><th>添加</th><th>连通</th><th>备注</th></tr>`;
        
        // 💡 注意这里：后端返回的是 { results, proxyIds }，所以要用 json.data.results 遍历
        if (json.data && Array.isArray(json.data.results)) {
            json.data.results.forEach(r => {
                html += `<tr>
                    <td><pre>${r.socks || ''}</pre></td>
                    <td class="${r.addOk?'ok':'fail'}">${r.addOk?'✅成功':'❌失败'}</td>
                    <td class="${r.testOk?'ok':'fail'}">${r.testOk?'✅可用':'❌不可用'}</td>
                    <td>${r.msg || ''}</td>
                </tr>`;
            });
        }
        resultBox.innerHTML = html + `</table>`;
    } catch (e) {
        resultBox.innerText = "网络异常: " + e.message;
    }
}

pushAdsBtn.onclick = ()=>pushToAdsPower(globalAfterSocksList, $("#adsResultBox"));
testAddBtn.onclick = ()=>{
    const raw = $("#testSocksTextarea").value.trim();
    if(!raw){ alert("请输入socks"); return; }
    const list = raw.split("\n").map(x=>x.trim()).filter(Boolean);
    pushToAdsPower(list, $("#testResultBox"));
};

// ===== 执行调换 =====
runBtn.onclick = async ()=>{
    const cookie = $("#cookieInput").value.trim();
    const idsRaw = $("#idsInput").value.trim();
    const resultBox = $("#resultBox");
    if(!cookie || !selectedIid || !idsRaw){ alert("参数不全"); return; }

    const idsArr = idsRaw.split(',').map(x=>x.trim()).filter(Boolean);
    runBtn.disabled = true;
    copyAllBtn.disabled = true;
    pushAdsBtn.disabled = true;
    globalAfterSocksList = [];
    resultBox.innerText = "处理中...";

    try{
        const resp = await fetch("/api/exchange_ip",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({cookie,iid:selectedIid,ids:idsArr,isrand:3})
        });
        const json = await resp.json();
        runBtn.disabled = false;

        if(json.code !==0){ resultBox.innerText = JSON.stringify(json,null,2); return; }

        const tableData = json.table;
        globalAfterSocksList = tableData.map(r=>r.afterSocks);
        copyAllBtn.disabled = false;
        pushAdsBtn.disabled = false;

        let html = `<table>
            <tr><th>项目</th><th>地区</th><th>ID</th><th>调换前</th><th>调换后</th></tr>`;
        tableData.forEach(row=>{
            html += `<tr>
                <td>${row.project}</td><td>${row.beforeCity}</td><td>${row.proxyId}</td>
                <td><pre>${row.beforeSocks}</pre></td><td><pre>${row.afterSocks}</pre></td>
            </tr>`;
        });
        resultBox.innerHTML = html + `</table>`;
    }catch(e){
        runBtn.disabled = false;
        resultBox.innerText = "网络异常: " + e.message;
    }
};



createEnvBtn.onclick = async () => {
    const envResultBox = $("#envResultBox");
    if (globalProxyIds.length === 0) {
        envResultBox.innerText = "没有可用的代理 ID";
        return;
    }
    envResultBox.innerText = "创建环境中...";
    const proxyIds = globalProxyIds.slice(0, 2); // Limit to 2 proxies per batch

    try {
        const resp = await fetch("/api/create_environment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxyIds }),
        });
        const json = await resp.json();
        console.log("Create Environment API Response:", json);
        
        if (json.code === 0) {
            createEnvBtn.disabled = true;
            envResultBox.innerText = `环境创建成功！创建的环境数: ${proxyIds.length}`;
        } else {
            //可能出错
            envResultBox.innerText = `环境创建失败`;
        }

        // 💡 核心修复：后端返回的数组在 json.data.createResults 里面
        if (json.data && Array.isArray(json.data.createResults)) {
            let html = `<table>
                <tr><th>Proxy ID</th><th>Profile ID</th><th>Profile No</th><th>状态</th><th>Message</th></tr>`;
                
            json.data.createResults.forEach(env => {
                html += `<tr>
                    <td>${env.proxy_id || "-"}</td>
                    <td>${env.profile_id || "-"}</td>
                    <td>${env.profile_no || "-"}</td>
                    <td class="${env.addOk ? 'ok' : 'fail'}">${env.addOk ? '✅成功' : '❌失败'}</td>
                    <td>${env.msg || "-"}</td>
                </tr>`;
            });
            
            envResultBox.innerHTML = html + `</table>`;

             // ===== NEW: START =====
            // 1. 收集所有创建【成功】的 proxy_id
            const successProxyIds = json.data.createResults
                .filter(env => env.addOk === true)
                .map(env => String(env.proxy_id)); // 确保转成字符串，防止类型不匹配

            console.log("创建成功的 Proxy IDs (即将从队列中移除):", successProxyIds);

            // 2. 从全局 globalProxyIds 中过滤掉这些已经成功的 ID
            globalProxyIds = globalProxyIds.filter(id => !successProxyIds.includes(String(id)));

            console.log("移除成功项后，剩余的 globalProxyIds:", globalProxyIds);
            // ===== NEW: END =====
        } else {
            envResultBox.innerText = "返回的数据格式不正确: " + JSON.stringify(json);
        }
    } catch (e) {
        envResultBox.innerText = "网络异常: " + e.message;
    }
};

</script>
</body>
</html>
